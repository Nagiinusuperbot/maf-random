<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAF Random</title>
<style>
  :root {
    --bg1: #07070d;
    --bg2: #121225;
    --accent: #8b5cf6;
    --accent2: #22d3ee;
    --text: #f8fafc;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 50% 45%, #25204a 0%, transparent 28%),
      radial-gradient(circle at 20% 20%, #11183a 0%, transparent 30%),
      linear-gradient(145deg, var(--bg1), var(--bg2));
  }

  .noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  }

  .app {
    width: min(92vw, 760px);
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .label {
    letter-spacing: .28em;
    text-transform: uppercase;
    font-size: 12px;
    opacity: .42;
    margin-bottom: 22px;
  }

  .display {
    min-height: 180px;
    display: grid;
    place-items: center;
    padding: 20px;
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.035);
    box-shadow:
      0 30px 100px rgba(0,0,0,.45),
      inset 0 1px rgba(255,255,255,.06);
    backdrop-filter: blur(14px);
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .display.reveal {
    animation: reveal .55s cubic-bezier(.16,1,.3,1);
    box-shadow:
      0 0 80px rgba(139,92,246,.22),
      0 30px 100px rgba(0,0,0,.45),
      inset 0 1px rgba(255,255,255,.08);
  }

  .code {
    display: inline-block;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(48px, 11vw, 100px);
    font-weight: 800;
    letter-spacing: 0;
    white-space: nowrap;
    line-height: 1;
    text-align: center;
    text-shadow: 0 0 35px rgba(139,92,246,.25);
  }

  .code .prefix {
    opacity: .48;
    font-weight: 500;
    letter-spacing: 0;
  }

  .code .letters {
    color: #fff;
    letter-spacing: .055em;
  }

  .options {
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
  }

  .switch {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    font-size: 12px;
    opacity: .62;
  }

  .switch input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .slider {
    position: relative;
    width: 38px;
    height: 21px;
    border-radius: 999px;
    background: rgba(255,255,255,.16);
    transition: background .2s ease;
  }

  .slider::after {
    content: "";
    position: absolute;
    width: 15px;
    height: 15px;
    left: 3px;
    top: 3px;
    border-radius: 50%;
    background: #fff;
    transition: transform .2s ease;
  }

  .switch input:checked + .slider {
    background: linear-gradient(135deg, var(--accent), #6366f1);
  }

  .switch input:checked + .slider::after {
    transform: translateX(17px);
  }

  button {
    margin-top: 34px;
    appearance: none;
    border: 0;
    color: white;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .04em;
    padding: 17px 42px;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    box-shadow: 0 12px 35px rgba(99,102,241,.28);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }

  button:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow: 0 16px 45px rgba(99,102,241,.4);
  }

  button:active { transform: translateY(1px) scale(.98); }
  button:disabled { cursor: default; opacity: .55; transform: none; }

  .wiki-result {
    min-height: 22px;
    margin-top: 13px;
    font-size: 11px;
    line-height: 1.5;
    opacity: 0;
    transition: opacity .25s ease;
  }

  .wiki-result.show {
    opacity: .5;
  }

  .wiki-result a {
    color: #c4b5fd;
    text-decoration: none;
  }

  .wiki-result a:hover {
    text-decoration: underline;
  }

  .hint {
    margin-top: 18px;
    font-size: 12px;
    opacity: .28;
  }

  .flash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at center, rgba(255,255,255,.95) 0%, rgba(139,92,246,.55) 9%, transparent 42%),
      radial-gradient(circle at center, rgba(34,211,238,.35), transparent 55%);
    opacity: 0;
    z-index: 10;
  }

  .flash.go { animation: flash .72s ease-out; }

  .display::before,
  .display::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255,255,255,.85);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    pointer-events: none;
  }

  .display {
    position: relative;
    overflow: visible;
  }

  .display.reveal::before {
    animation: ring 1s cubic-bezier(.1,.7,.2,1) forwards;
  }

  .display.reveal::after {
    animation: ring 1s .12s cubic-bezier(.1,.7,.2,1) forwards;
  }

  .display.reveal .code {
    animation: jackpotText .72s cubic-bezier(.12,1.4,.35,1) both;
  }

  .jackpot {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 11;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(.2);
    font-size: clamp(18px, 5vw, 38px);
    font-weight: 900;
    letter-spacing: .22em;
    white-space: nowrap;
    color: white;
    text-shadow:
      0 0 8px white,
      0 0 24px #8b5cf6,
      0 0 50px #22d3ee;
    opacity: 0;
  }

  .jackpot.go {
    animation: jackpot .72s cubic-bezier(.12,1.2,.3,1) forwards;
  }

  body.pvp-mode {
    animation: pvpShake .72s linear;
  }

  body.pvp-mode::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 9;
    pointer-events: none;
    background:
      radial-gradient(circle at center, transparent 0 12%, rgba(255,255,255,.28) 18%, transparent 31%),
      conic-gradient(from 0deg, transparent, rgba(139,92,246,.22), transparent 22%, rgba(34,211,238,.2), transparent 48%, rgba(255,255,255,.18), transparent 74%);
    mix-blend-mode: screen;
    animation: pvpStrobe .95s steps(1,end);
  }

  body.pvp-mode .flash.go {
    animation: pvpFlash 1s ease-out;
  }

  body.pvp-mode .display {
    animation: pvpPanel .9s cubic-bezier(.12,1.2,.3,1);
    border-color: rgba(255,255,255,.24);
    box-shadow:
      0 0 35px rgba(255,255,255,.18),
      0 0 110px rgba(139,92,246,.34),
      0 30px 100px rgba(0,0,0,.45),
      inset 0 1px rgba(255,255,255,.16);
  }

  .pvp-burst-label {
    position: fixed;
    left: 50%;
    top: calc(50% + min(24vw, 160px));
    z-index: 12;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(.2);
    font-size: clamp(12px, 2.5vw, 20px);
    font-weight: 900;
    letter-spacing: .32em;
    color: white;
    text-shadow: 0 0 12px white, 0 0 30px #8b5cf6, 0 0 55px #22d3ee;
    opacity: 0;
    white-space: nowrap;
  }

  .pvp-burst-label.go {
    animation: pvpLabel .9s cubic-bezier(.1,1.3,.3,1) forwards;
  }

  .pvp-ring {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 30px;
    height: 30px;
    border: 5px solid rgba(255,255,255,.9);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    animation: pvpRing .95s cubic-bezier(.08,.7,.18,1) forwards;
  }

  .particle {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    background: white;
    animation: particle .8s cubic-bezier(.2,.8,.3,1) forwards;
  }

  @keyframes reveal {
    0%   { transform: scale(.96); }
    45%  { transform: scale(1.035); }
    100% { transform: scale(1); }
  }

  @keyframes flash {
    0% { opacity: 0; }
    12% { opacity: 1; }
    24% { opacity: .25; }
    38% { opacity: .85; }
    100% { opacity: 0; }
  }

  @keyframes ring {
    0% {
      transform: translate(-50%, -50%) scale(0);
      opacity: .9;
    }
    70% { opacity: .5; }
    100% {
      transform: translate(-50%, -50%) scale(24);
      opacity: 0;
    }
  }

  @keyframes jackpot {
    0% {
      transform: translate(-50%, -50%) scale(.15) rotate(-8deg);
      opacity: 0;
    }
    38% {
      transform: translate(-50%, -50%) scale(1.25) rotate(2deg);
      opacity: 1;
    }
    62% {
      transform: translate(-50%, -50%) scale(.95) rotate(0);
      opacity: 1;
    }
    100% {
      transform: translate(-50%, -50%) scale(1) rotate(0);
      opacity: 0;
    }
  }

  @keyframes jackpotText {
    0% { transform: scale(.72); filter: brightness(1); }
    38% { transform: scale(1.18); filter: brightness(2.2); }
    62% { transform: scale(.94); filter: brightness(1.4); }
    100% { transform: scale(1); filter: brightness(1); }
  }

  @keyframes pvpShake {
    0%,100% { transform: translate(0,0); }
    10% { transform: translate(-7px, 3px) rotate(-.4deg); }
    20% { transform: translate(8px, -4px) rotate(.45deg); }
    30% { transform: translate(-9px, -3px) rotate(-.35deg); }
    40% { transform: translate(7px, 5px) rotate(.35deg); }
    50% { transform: translate(-5px, -5px) rotate(-.25deg); }
    60% { transform: translate(5px, 2px) rotate(.25deg); }
    70% { transform: translate(-3px, -2px); }
    80% { transform: translate(2px, 1px); }
  }

  @keyframes pvpStrobe {
    0%, 100% { opacity: 0; transform: scale(1) rotate(0deg); }
    12% { opacity: .95; transform: scale(1.05) rotate(10deg); }
    25% { opacity: .2; transform: scale(1.12) rotate(22deg); }
    38% { opacity: .85; transform: scale(1.02) rotate(38deg); }
    51% { opacity: .18; transform: scale(1.16) rotate(56deg); }
    65% { opacity: .75; transform: scale(1.04) rotate(72deg); }
    78% { opacity: .12; transform: scale(1.2) rotate(92deg); }
  }

  @keyframes pvpFlash {
    0% { opacity: 0; }
    8% { opacity: 1; }
    16% { opacity: .15; }
    25% { opacity: .92; }
    34% { opacity: .08; }
    43% { opacity: .72; }
    100% { opacity: 0; }
  }

  @keyframes pvpPanel {
    0% { transform: scale(.94); filter: brightness(1); }
    18% { transform: scale(1.055); filter: brightness(1.75); }
    32% { transform: scale(.97); filter: brightness(1.15); }
    48% { transform: scale(1.045); filter: brightness(2.1); }
    65% { transform: scale(.99); filter: brightness(1.35); }
    100% { transform: scale(1); filter: brightness(1); }
  }

  @keyframes pvpLabel {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(-8deg); }
    28% { opacity: 1; transform: translate(-50%, -50%) scale(1.25) rotate(2deg); }
    58% { opacity: 1; transform: translate(-50%, -50%) scale(.95) rotate(0); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05); }
  }

  @keyframes pvpRing {
    0% { transform: translate(-50%, -50%) scale(.05); opacity: 1; }
    35% { opacity: .8; }
    100% { transform: translate(-50%, -50%) scale(34); opacity: 0; }
  }

  @keyframes particle {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
  }
</style>
</head>
<body>
<div class="noise"></div>
<div class="flash" id="flash"></div>
<div class="jackpot" id="jackpot">RESULT!</div>
<div class="pvp-burst-label" id="pvpLabel">SPECIAL PVP</div>

<main class="app">
  <div class="label">RANDOM CODE GENERATOR</div>

  <div class="options">
    <label class="switch">
      <input type="checkbox" id="randomPrefix">
      <span class="slider"></span>
      <span>6文字ランダム</span>
    </label>
  </div>

  <section class="display" id="display">
    <div class="code">
      <span class="prefix" id="prefix">MAF </span><span class="letters" id="letters">---</span>
    </div>
  </section>

  <div class="wiki-result" id="wikiResult" aria-live="polite"></div>

  <button id="go">GENERATE</button>
  <div class="hint">SPACEキーでも生成できます</div>
</main>

<script>
const letters = document.getElementById("letters");
const prefix = document.getElementById("prefix");
const randomPrefix = document.getElementById("randomPrefix");
const display = document.getElementById("display");
const button = document.getElementById("go");
const flash = document.getElementById("flash");
const jackpot = document.getElementById("jackpot");
const pvpLabel = document.getElementById("pvpLabel");
const wikiResult = document.getElementById("wikiResult");

let busy = false;

async function showWikipediaLink(code) {
  wikiResult.classList.remove("show");
  wikiResult.innerHTML = "";

  // Wikipediaの検索APIを使い、完全一致だけでなく関連性の高い記事も拾う。
  try {
    const searchUrl =
      "https://ja.wikipedia.org/w/rest.php/v1/search/page?q=" +
      encodeURIComponent(code) + "&limit=5";

    const res = await fetch(searchUrl);
    if (!res.ok) return;

    const data = await res.json();
    const results = Array.isArray(data?.pages) ? data.pages : [];
    if (!results.length) return;

    // 完全一致を最優先。それがなければWikipedia検索の先頭結果を採用。
    const normalized = code.trim().toUpperCase();
    const exact = results.find(x => (x.title || "").trim().toUpperCase() === normalized);
    const hit = exact || results[0];
    if (!hit?.title) return;

    const title = hit.title;
    const description = hit.description ? " · " + hit.description : "";
    const url = "https://ja.wikipedia.org/wiki/" + encodeURIComponent(title.replace(/ /g, "_"));

    wikiResult.innerHTML =
      'Wikipedia: <a href="' + url + '" target="_blank" rel="noopener noreferrer">' +
      escapeHtml(title) + "</a>" + escapeHtml(description);
    wikiResult.classList.add("show");
  } catch (_) {
    // オフライン等では何も表示しない
  }
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}
let audioCtx = null;

const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

function formatCode(code) {
  return code.length === 6 ? code.slice(0, 3) + " " + code.slice(3) : code;
}

function randomCode(length = 3) {
  let out = "";
  for (let i = 0; i < length; i++) {
    out += alphabet[Math.floor(Math.random() * alphabet.length)];
  }
  return out;
}

function beep(freq, duration, volume = 0.025, type = "sine") {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (_) {}
}

function burst() {
  const cx = innerWidth / 2;
  const cy = innerHeight / 2;
  for (let i = 0; i < 22; i++) {
    const p = document.createElement("i");
    p.className = "particle";
    p.style.left = cx + "px";
    p.style.top = cy + "px";
    const angle = Math.random() * Math.PI * 2;
    const distance = 90 + Math.random() * 230;
    p.style.setProperty("--x", Math.cos(angle) * distance + "px");
    p.style.setProperty("--y", Math.sin(angle) * distance + "px");
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 850);
  }
}

async function generate() {
  if (busy) return;
  busy = true;
  button.disabled = true;

  const duration = 1500 + Math.random() * 650;
  const start = performance.now();
  let last = 0;

  // 最終結果を先に決める
  const sixMode = randomPrefix.checked;
  const finalCode = randomCode(sixMode ? 6 : 3);
  prefix.textContent = sixMode ? "" : "MAF ";

  // 「Pリーチ」は3文字モードだけ。6文字モードでは常に通常表示。
  const isP = !sixMode && finalCode[0] === "P";

  const tick = (now) => {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const interval = 42 + progress * progress * 190;

    if (now - last >= interval) {
      letters.textContent = formatCode(randomCode(sixMode ? 6 : 3));
      last = now;

      const pitch = 180 + (1 - progress) * 220;
      beep(pitch, 0.035, 0.012, "square");
    }

    if (progress < 1) {
      requestAnimationFrame(tick);
    } else {
      if (isP) {
        stagedReveal(finalCode);
      } else {
        normalReveal(finalCode);
      }
    }
  };

  requestAnimationFrame(tick);
}

function normalReveal(finalCode) {
  letters.textContent = formatCode(finalCode);

  display.classList.remove("reveal");
  void display.offsetWidth;
  display.classList.add("reveal");

  flash.classList.remove("go");
  void flash.offsetWidth;
  flash.classList.add("go");

  // 通常結果では「RESULT!」を表示しない
  jackpot.classList.remove("go");

  showWikipediaLink(finalCode);

  beep(440, 0.07, 0.025);
  setTimeout(() => beep(660, 0.08, 0.032), 65);
  setTimeout(() => beep(880, 0.10, 0.035), 135);
  setTimeout(() => beep(1320, 0.18, 0.025), 215);
  burst();
  setTimeout(burst, 120);

  setTimeout(() => {
    button.disabled = false;
    busy = false;
  }, 850);
}

function stagedReveal(finalCode) {
  // 3文字モードだけ段階表示
  letters.textContent = "P__";
  beep(520, 0.10, 0.025);

  setTimeout(() => {
    letters.textContent = "P" + finalCode[1] + "_";
    beep(720, 0.12, 0.03);

    setTimeout(() => {
      letters.textContent = finalCode;
      beep(980, 0.13, 0.035);

      setTimeout(() => {
        if (finalCode === "PVP") {
          pvpReveal();
        } else {
          normalReveal(finalCode);
        }
      }, finalCode === "PVP" ? 360 : 130);
    }, 430);
  }, 430);
}

function pvpReveal() {
  letters.textContent = "PVP";

  document.body.classList.remove("pvp-mode");
  void document.body.offsetWidth;
  document.body.classList.add("pvp-mode");

  display.classList.remove("reveal");
  void display.offsetWidth;
  display.classList.add("reveal");

  flash.classList.remove("go");
  void flash.offsetWidth;
  flash.classList.add("go");

  pvpLabel.classList.remove("go");
  void pvpLabel.offsetWidth;
  pvpLabel.classList.add("go");

  jackpot.textContent = "P V P";
  jackpot.classList.remove("go");
  void jackpot.offsetWidth;
  jackpot.classList.add("go");

  // PVP専用の連続上昇音。通常結果より一段派手に。
  const notes = [
    [440, 0.08, 0.028], [554, 0.08, 0.03], [659, 0.08, 0.032],
    [784, 0.09, 0.036], [988, 0.10, 0.04], [1175, 0.11, 0.043],
    [1397, 0.12, 0.045], [1760, 0.25, 0.04]
  ];
  notes.forEach((n, i) => setTimeout(() => beep(n[0], n[1], n[2], "square"), i * 75));

  // 大量パーティクル + 時間差の二段爆発
  burst();
  setTimeout(burst, 90);
  setTimeout(burst, 190);
  setTimeout(burst, 330);
  setTimeout(() => {
    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        const ring = document.createElement("div");
        ring.className = "pvp-ring";
        ring.style.animationDelay = (i * 0.08) + "s";
        document.body.appendChild(ring);
        setTimeout(() => ring.remove(), 1150);
      }, i * 95);
    }
  }, 40);

  showWikipediaLink("PVP");

  setTimeout(() => {
    jackpot.classList.remove("go");
    pvpLabel.classList.remove("go");
    document.body.classList.remove("pvp-mode");
    button.disabled = false;
    busy = false;
  }, 1250);
}

randomPrefix.addEventListener("change", () => {
  prefix.textContent = randomPrefix.checked ? "" : "MAF ";
  letters.textContent = randomPrefix.checked ? "--- ---" : "---";
  wikiResult.classList.remove("show");
  wikiResult.innerHTML = "";
});

button.addEventListener("click", generate);

document.addEventListener("keydown", e => {
  if (e.code === "Space" && !busy) {
    e.preventDefault();
    generate();
  }
});
</script>
</body>
</html>
